spring.application.name=transacciones

# Conexion a PostgreSQL. Los valores se toman de variables de entorno;
# la clave de la base de datos no tiene valor por defecto.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Clave para firmar los JWT (minimo 32 caracteres para HS256)
jwt.secret=${JWT_SECRET}

# Duracion del token en milisegundos (1 hora)
jwt.expiration=3600000
